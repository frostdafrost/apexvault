{% extends 'base.html' %}
{% block content %}
<style>
    .chat-container { 
        max-width: 800px; 
        margin: 10px auto; 
        display: flex; 
        flex-direction: column; 
        height: calc(100vh - 120px); 
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--gold-light);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 15px;
        transition: 0.3s;
        background: rgba(212, 175, 55, 0.1);
        padding: 10px 18px;
        border-radius: 20px;
        border: 1px solid var(--border);
        width: fit-content;
    }

    .back-link:hover {
        background: rgba(212, 175, 55, 0.2);
        border-color: var(--gold);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .chat-card { 
        background: linear-gradient(160deg, #16130d, #100d09); 
        border-radius: 24px; 
        border: 1px solid var(--border-strong); 
        display: flex; 
        flex-direction: column; 
        flex: 1; 
        overflow: hidden; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 50px rgba(212, 175, 55, 0.08);
        position: relative;
    }

    .chat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        opacity: 0.6;
        z-index: 10;
    }
    
    /* Header */
    .chat-header { 
        padding: 20px 25px; 
        border-bottom: 1px solid var(--border); 
        background: rgba(20, 17, 12, 0.9); 
        flex-shrink: 0; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
    }

    .chat-header h2 {
        font-family: 'Playfair Display', serif;
        font-weight: 800; 
        font-size: 18px; 
        margin: 0; 
        color: var(--gold-light);
        letter-spacing: 0.5px;
    }

    .chat-header a { 
        color: var(--gold); 
        text-decoration: none; 
        font-size: 18px; 
        cursor: pointer; 
        transition: 0.3s;
        width: 32px;
        height: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background: rgba(212, 175, 55, 0.1);
    }
    .chat-header a:hover {
        background: var(--danger);
        color: #fff;
    }
    
    /* Messages Area */
    .chat-messages { 
        flex: 1; 
        padding: 25px; 
        overflow-y: auto; 
        display: flex; 
        flex-direction: column; 
        gap: 18px; 
        background: rgba(10, 9, 8, 0.4); 
    }
    
    /* Message Bubbles */
    .msg { 
        padding: 14px 18px; 
        border-radius: 18px; 
        max-width: 75%; 
        font-size: 14px; 
        line-height: 1.5; 
        word-wrap: break-word;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .msg-admin { 
        background: linear-gradient(135deg, var(--gold), var(--gold-deep)); 
        color: #1a1410; 
        align-self: flex-end; 
        border-bottom-right-radius: 4px; 
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .msg-admin:active {
        transform: scale(0.98);
    }

    .msg-user { 
        background: rgba(20, 17, 12, 0.8); 
        color: var(--text-dark); 
        align-self: flex-start; 
        border-bottom-left-radius: 4px; 
        border: 1px solid var(--border-strong); 
    }

    .msg-image {
        max-width: 100%; 
        border-radius: 10px; 
        margin-top: 8px; 
        cursor: pointer; 
        border: 1px solid rgba(0,0,0,0.1); 
        transition: 0.2s;
    }
    .msg-user .msg-image {
        border: 1px solid var(--border);
    }
    .msg-image:hover {
        filter: brightness(1.1);
    }

    /* Form */
    .chat-form { 
        display: flex; 
        padding: 15px 20px; 
        border-top: 1px solid var(--border); 
        background: rgba(10, 9, 8, 0.9); 
        align-items: flex-end; 
        gap: 10px; 
        flex-shrink: 0; 
        flex-wrap: nowrap; 
    }
    
    .chat-form textarea { 
        flex: 1; 
        min-width: 0; 
        padding: 15px 20px; 
        border: 1px solid var(--border); 
        border-radius: 12px; 
        outline: none; 
        font-size: 14px; 
        background: rgba(20, 17, 12, 0.6); 
        color: var(--text-dark);
        transition: 0.3s;
        resize: none; 
        max-height: 120px; 
        overflow-y: auto;
        font-family: inherit;
        line-height: 1.5;
    }
    .chat-form textarea:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    .chat-form textarea::placeholder {
        color: var(--text-muted);
    }
    
    .chat-form button[type="submit"] { 
        flex-shrink: 0; 
        background: linear-gradient(135deg, var(--gold), var(--gold-deep)); 
        color: #1a1410; 
        border: none; 
        padding: 15px 25px; 
        border-radius: 12px; 
        font-weight: 800; 
        font-size: 14px;
        letter-spacing: 0.5px;
        cursor: pointer; 
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        height: 52px; 
    }
    .chat-form button[type="submit"]:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
    }
    .chat-form button[type="submit"]:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
    }
    
    .chat-form .camera-btn { 
        flex-shrink: 0; 
        background: rgba(212, 175, 55, 0.1); 
        color: var(--gold); 
        font-size: 18px; 
        padding: 10px; 
        border: 1px solid var(--border); 
        border-radius: 10px;
        cursor: pointer; 
        transition: 0.3s;
        height: 52px;
        width: 52px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .chat-form .camera-btn:hover {
        background: rgba(212, 175, 55, 0.2);
        border-color: var(--gold);
    }

    /* --- EDIT/DELETE MODAL --- */
    .edit-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(5, 4, 3, 0.8);
        backdrop-filter: blur(8px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        padding: 20px;
    }
    .edit-modal {
        background: linear-gradient(160deg, #1a1610, #100d09);
        border: 1px solid var(--border-strong);
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(212, 175, 55, 0.1);
        position: relative;
    }
    .edit-modal::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .edit-modal h3 {
        font-family: 'Playfair Display', serif;
        color: var(--gold-light);
        margin-bottom: 15px;
        font-size: 22px;
    }
    .edit-modal textarea {
        width: 100%;
        padding: 15px;
        background: rgba(10, 9, 8, 0.6);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text-dark);
        font-size: 14px;
        outline: none;
        resize: vertical;
        min-height: 100px;
        margin-bottom: 20px;
    }
    .edit-modal textarea:focus {
        border-color: var(--gold);
    }
    .modal-actions {
        display: flex;
        gap: 10px;
    }
    .modal-btn {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        border: none;
        transition: 0.3s;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .btn-save { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #1a1410; }
    .btn-save:hover { filter: brightness(1.1); }
    .btn-delete { background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); }
    .btn-delete:hover { background: var(--danger); color: #fff; }
    .btn-cancel { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-cancel:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

    @media (max-width: 768px) {
        .chat-container { height: calc(100vh - 140px); padding: 0 15px; }
        .chat-form { padding: 10px; gap: 8px; }
        .chat-form textarea { padding: 12px; font-size: 13px; }
        .chat-form button[type="submit"] { padding: 12px 15px; font-size: 13px; height: 48px; }
        .chat-form .camera-btn { height: 48px; width: 48px; }
        .msg { max-width: 85%; padding: 12px 14px; }
    }
</style>

<div class="chat-container">
    <a href="{% url 'admin_chat_list' %}" class="back-link">← Back to Inbox</a>
    
    <div class="chat-card">
        <div class="chat-header">
            <h2>Chat with {{ target_user.username }}</h2>
            <a href="{% url 'admin_chat_list' %}" title="Close Chat">✖</a>
        </div>
        
        <div class="chat-messages" id="adminChatMessages">
            <!-- Messages will be injected here by JavaScript -->
        </div>

        <form method="POST" enctype="multipart/form-data" class="chat-form" id="chatForm">
            {% csrf_token %}
            <input type="file" name="image" id="adminCameraUpload" accept="image/*" capture="user" style="display: none;">
            <button type="button" class="camera-btn" onclick="document.getElementById('adminCameraUpload').click()" title="Take Photo">📷</button>
            
            <input type="file" name="image" id="adminGalleryUpload" accept="image/*" style="display: none;">
            <button type="button" class="camera-btn" onclick="document.getElementById('adminGalleryUpload').click()" title="Upload from Gallery">🖼️</button>

            <textarea name="reply" id="chatReplyInput" placeholder="Type your reply..." autocomplete="off" rows="1"></textarea>
            <button type="submit" id="sendBtn">Send</button>
        </form>
    </div>
</div>

<!-- EDIT / UNSEND MODAL -->
<div class="edit-modal-overlay" id="editModal">
    <div class="edit-modal">
        <h3>Edit or Unsend</h3>
        <form method="POST" id="editMessageForm">
            {% csrf_token %}
            <textarea name="new_text" id="editMessageText"></textarea>
            <div class="modal-actions">
                <button type="button" class="modal-btn btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button type="submit" class="modal-btn btn-save" formaction="">Save</button>
                <button type="submit" class="modal-btn btn-delete" formaction="" onclick="return confirm('Are you sure you want to unsend this message permanently?');">Unsend</button>
            </div>
        </form>
    </div>
</div>

<script>
    const targetUserId = "{{ target_user.id }}";
    const targetUsername = "{{ target_user.username }}";
    const chatBox = document.getElementById('adminChatMessages');
    const chatForm = document.getElementById('chatForm');
    const textInput = document.getElementById('chatReplyInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInputs = chatForm.querySelectorAll('input[type="file"]');
    
    let currentMessages = [];
    let lastMessagesHash = "";

    // 1. Expand Textarea
    textInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // 2. Render Messages Function
    function renderMessages(messages) {
        currentMessages = messages;
        const isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;
        
        chatBox.innerHTML = '';
        
        if (messages.length === 0) {
            chatBox.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:14px; margin-top:20px;">No messages yet.</p>';
            return;
        }

        messages.forEach(msg => {
            if (msg.is_admin) {
                chatBox.innerHTML += `
                    <div class="msg msg-admin" data-id="${msg.id}">
                        <div style="font-size: 10px; font-weight: 800; margin-bottom: 4px; color: rgba(26, 20, 16, 0.6); letter-spacing: 0.5px;">APEXVAULT ADMIN (Double-tap to edit)</div>
                        ${msg.message ? `<div style="margin-bottom: ${msg.image_url ? '8px' : '0'}; font-weight: 500;">${escapeHTML(msg.message)}</div>` : ''}
                        ${msg.image_url ? `<a href="${msg.image_url}" target="_blank" download><img src="${msg.image_url}" class="msg-image" style="border: 2px solid rgba(0,0,0,0.1);"></a>` : ''}
                        <div style="font-size: 10px; opacity: 0.6; margin-top: 6px; text-align: right; font-weight: bold;">${msg.time}</div>
                    </div>
                `;
            } else {
                chatBox.innerHTML += `
                    <div class="msg msg-user">
                        <div style="font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--gold); letter-spacing: 0.5px;">${targetUsername.toUpperCase()}</div>
                        ${msg.message ? `<div style="margin-bottom: ${msg.image_url ? '8px' : '0'}; font-weight: 500;">${escapeHTML(msg.message)}</div>` : ''}
                        ${msg.image_url ? `<a href="${msg.image_url}" target="_blank" download><img src="${msg.image_url}" class="msg-image"></a>` : ''}
                        <div style="font-size: 10px; color: var(--text-muted); margin-top: 6px; font-weight: 600;">${msg.time}</div>
                    </div>
                `;
            }
        });

        if (isScrolledToBottom) {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    // 3. Fetch Messages (Polling)
    function fetchMessages() {
        fetch(`/control-panel/chats/${targetUserId}/api/`)
            .then(response => response.json())
            .then(data => {
                const currentHash = JSON.stringify(data.messages);
                if (currentHash === lastMessagesHash) return; // No changes
                lastMessagesHash = currentHash;
                renderMessages(data.messages);
            })
            .catch(err => console.error("Error fetching messages:", err));
    }

    // 4. Submit Form via AJAX
    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        submitChatForm();
    });

    fileInputs.forEach(input => {
        input.addEventListener('change', function() {
            if (this.files.length > 0) {
                submitChatForm();
            }
        });
    });

    function submitChatForm() {
        const formData = new FormData(chatForm);
        const hasText = textInput.value.trim() !== '';
        let hasFile = false;
        fileInputs.forEach(input => { if (input.files.length > 0) hasFile = true; });

        if (!hasText && !hasFile) return;

        sendBtn.disabled = true;
        sendBtn.innerText = '...';

        fetch("", {
            method: 'POST',
            headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
            body: formData
        }).then(response => {
            if (response.ok) {
                textInput.value = '';
                textInput.style.height = 'auto'; // Reset height
                fileInputs.forEach(input => input.value = '');
                fetchMessages(); // Refresh immediately
            }
            sendBtn.disabled = false;
            sendBtn.innerText = 'Send';
        });
    }

    // 5. Double Tap to Edit/Delete (Event Delegation)
    chatBox.addEventListener('dblclick', function(e) {
        const msgDiv = e.target.closest('.msg-admin');
        if (msgDiv) {
            const msgId = msgDiv.getAttribute('data-id');
            const msgObj = currentMessages.find(m => m.id == msgId);
            if (msgObj) {
                openEditModal(msgId, msgObj.message || '');
            }
        }
    });

    function openEditModal(msgId, currentText) {
        document.getElementById('editMessageText').value = currentText;
        
        const form = document.getElementById('editMessageForm');
        const saveBtn = form.querySelector('.btn-save');
        const deleteBtn = form.querySelector('.btn-delete');
        
        saveBtn.setAttribute('formaction', `/control-panel/message/${msgId}/edit/`);
        deleteBtn.setAttribute('formaction', `/control-panel/message/${msgId}/delete/`);
        
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    // Utility to prevent XSS
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    // Start Polling
    document.addEventListener("DOMContentLoaded", function() {
        fetchMessages();
        setInterval(fetchMessages, 3000); // Poll every 3 seconds
    });
</script>
{% endblock %}
