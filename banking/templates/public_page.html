<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }} | ApexVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-base: #0a0908; 
            --bg-card: rgba(20, 17, 12, 0.65);
            --gold: #d4af37; 
            --gold-light: #f7e7a0;
            --gold-deep: #8c6d1f;
            --gold-glow: rgba(212, 175, 55, 0.35);
            --text-main: #f5f0e1;
            --text-muted: #8a8270; 
            --border: rgba(212, 175, 55, 0.15); 
            --border-strong: rgba(212, 175, 55, 0.4);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            overflow-x: hidden;
        }

        /* Background Animated Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: floatOrb 10s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(212, 175, 55, 0.12); top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: rgba(140, 109, 31, 0.1); bottom: -50px; right: -50px; animation-delay: -5s; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.1); }
        }

        /* Noise overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }
        
        /* Navbar */
        .navbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 20px 8%; 
            width: 100%; 
            background: rgba(10, 9, 8, 0.7); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); 
            position: relative;
            z-index: 100;
        }
        
        .brand { 
            font-family: 'Playfair Display', serif;
            font-size: 24px; 
            font-weight: 800; 
            letter-spacing: 1.5px; 
            text-decoration: none;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-deep));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 4s linear infinite;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes goldShine {
            to { background-position: 200% center; }
        }
        
        .nav-links { display: flex; align-items: center; }
        .nav-links a { 
            text-decoration: none; 
            color: var(--text-muted); 
            font-weight: 500; 
            margin-left: 30px; 
            transition: 0.3s; 
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .nav-links a:hover { 
            color: var(--gold-light); 
            text-shadow: 0 0 10px var(--gold-glow);
        }
        
        /* Content Area */
        .content-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 60px 20px; 
            position: relative; 
            z-index: 10;
        }
        
        .content-box { 
            background: var(--bg-card); 
            border: 1px solid var(--border-strong); 
            padding: 50px 60px; 
            border-radius: 24px; 
            max-width: 800px; 
            width: 100%; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 60px rgba(212, 175, 55, 0.08), inset 0 1px 0 rgba(247, 231, 160, 0.15); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            animation: slideUpFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 { 
            font-family: 'Playfair Display', serif;
            font-size: 42px; 
            margin-bottom: 30px; 
            background: linear-gradient(135deg, #ffffff, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        
        /* Target the HTML injected via |safe */
        .content-body p { 
            font-size: 16px; 
            line-height: 1.8; 
            color: var(--text-main); 
            margin-bottom: 20px; 
            font-weight: 400;
        }

        .content-body strong {
            color: var(--gold-light);
            font-weight: 700;
        }

        .content-body em {
            color: var(--text-muted);
            font-style: normal;
            font-size: 14px;
        }
        
        /* Footer */
        .footer { 
            background: #050403; 
            padding: 30px 8%; 
            border-top: 1px solid var(--border); 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 13px; 
            letter-spacing: 0.5px;
            position: relative; 
            z-index: 10;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 15px; padding: 15px 5%; }
            .nav-links a { margin-left: 15px; margin-right: 15px; }
            .content-box { padding: 35px 25px; }
            h1 { font-size: 32px; }
            .content-body p { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">🛡️ APEXVAULT</a>
        <div class="nav-links">
            <a href="{% url 'home' %}">← Back to Home</a>
            <a href="{% url 'login' %}">Log In</a>
        </div>
    </nav>

    <div class="content-container">
        <div class="content-box">
            <h1>{{ title }}</h1>
            <div class="content-body">
                {{ text|safe }}
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 ApexVault Financial Technologies. All rights reserved.</p>
    </footer>

</body>
</html>
